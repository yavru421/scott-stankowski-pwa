<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoshNews</title>
    
    <meta name="theme-color" content="#fc4903">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon-192x192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192x192.png">
    <meta name="apple-mobile-web-app-title" content="StoshNews">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #fff;
            text-align: center;
            max-width: 100vw;
        }
        
        .video-container {
            margin: 10px auto;
            max-width: 560px;
            width: 100%;
            position: relative;
            overflow: hidden;
            min-height: 315px;
        }
        
        .video-container iframe {
            width: 100%;
            height: 429px;
            display: block;
        }
        
        header, footer {
            background: #000;
            padding: 10px;
        }
        
        h1 { font-size: 2rem; }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #fc4903;
            color: white;
            border: none;
            border-radius: 30px;
            display: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .install-btn:hover {
            background: #ff6b2b;
        }
    </style>
</head>
<body>
    <header>
        <h1>StoshNews</h1>
    </header>
    
    <div id="video-container">
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/561780440248038/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/1111103134130383/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/post.php?href=https://www.facebook.com/permalink.php?story_fbid=pfbid02HL3yWvjxwqN6fJxV923xrXmKPBHjxoa7LsiMTkyiAEmzEypihQLv1T6QmiAcgZEGl&id=61562132317250&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/1318313399284753/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/516052221160140/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/433207333148133/?idorvanity=867487150445792&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/947112336947655/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
        <div class="video-container">
            <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/2286538441690999/&show_text=true" allowfullscreen frameborder="0"></iframe>
        </div>
    </div>
    
    <button id="install-btn" class="install-btn">Add to Home Screen</button>
    
    <footer>
        <p>&copy; 2024 StoshNews</p>
    </footer>
    
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
            }
            deferredPrompt = null;
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoshNews</title>
    
    <meta name="theme-color" content="#fc4903">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon-192x192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192x192.png">
    <meta name="apple-mobile-web-app-title" content="StoshNews">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: system-ui, sans-serif;
            background: #121212;
            color: #fff;
            text-align: center;
            max-width: 100vw;
        }
        
        .video-container {
            margin: 10px auto;
            max-width: 560px;
            width: 100%;
            position: relative;
            overflow: hidden;
            min-height: 315px;
        }
        
        header, footer {
            background: #000;
            padding: 10px;
        }
        
        h1 { font-size: 2rem; }
    </style>
</head>
<body>
    <header>
        <h1>StoshNews</h1>
    </header>
    
    <div id="video-container"></div>
    
    <footer>
        <p>&copy; 2024 StoshNews</p>
    </footer>
    
    <script>
        const videoUrls = [
            'https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2F61562132317250%2Fvideos%2F1574627393251489%2F&show_text=false&width=560&t=0',
            'https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2F61562132317250%2Fvideos%2F486103221194799%2F&show_text=false&width=560&t=0'
        ];
        
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('video-container');
            videoUrls.forEach(url => {
                const videoDiv = document.createElement('div');
                videoDiv.className = 'video-container';
                videoDiv.innerHTML = `<iframe src="${url}" allowfullscreen frameborder="0" loading="lazy"></iframe>`;
                container.appendChild(videoDiv);
            });
        });
    </script>
</body>
</html>

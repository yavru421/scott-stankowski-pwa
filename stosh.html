<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content=
"width=device-width, initial-scale=1.0">
<title>StoshNews</title>
<meta name="theme-color" content="#fc4903">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./assets/icon-192x192.png">
<link rel="apple-touch-icon" href="./assets/icon-192x192.png">
<meta name="apple-mobile-web-app-title" content="StoshNews">
<meta name="description" content=
"StoshNews - Latest video updates">
<style>
        :root {
            --primary: #fc4903;
            --primary-hover: #ff6b2b;
            --bg: #121212;
            --header-bg: #000;
            --text: #fff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            text-align: center;
            max-width: 100vw;
            line-height: 1.5;
        }

        .video-container {
            margin: 20px auto;
            max-width: 560px;
            width: 95%;
            position: relative;
            overflow: hidden;
            aspect-ratio: 16/9;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        header, footer {
            background: var(--header-bg);
            padding: 15px;
            position: sticky;
        }

        header {
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        footer {
            bottom: 0;
            font-size: 0.9rem;
        }

        h1 { 
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .share-btn {
            margin: 10px auto;
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 30px;
            display: block;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: background 0.2s ease;
        }

        .share-btn:hover, .share-btn:focus {
            background: var(--primary-hover);
        }

        #video-container {
            padding: 10px 0;
        }

        .fb-container {
            margin: 20px auto;
            display: flex;
            justify-content: center;
        }
</style>
</head>
<body>
<header>
<h1>StoshNews</h1>
<button id="share-btn" class="share-btn">Share / Add to Home
Screen</button></header>
<main>
<div id="fb-root"></div>
<div class="fb-container fb-page" data-href=
"https://www.facebook.com/profile.php?id=61562132317250" data-tabs=
"timeline" data-width="500" data-height="600" data-small-header=
"false" data-adapt-container-width="true" data-hide-cover="false"
data-show-facepile="true">
<blockquote cite=
"https://www.facebook.com/profile.php?id=61562132317250" class=
"fb-xfbml-parse-ignore"><a href=
"https://www.facebook.com/profile.php?id=61562132317250">StoshNews</a></blockquote>
</div>
<div id="video-container">
<div class="video-container"><iframe src=
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/561780440248038/&amp;show_text=true"
loading="lazy" allowfullscreen title=
"StoshNews video 1"></iframe></div>
<div class="video-container"><iframe src=
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/1111103134130383/&amp;show_text=true"
loading="lazy" allowfullscreen title=
"StoshNews video 2"></iframe></div>
<div class="video-container"><iframe src=
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/433207333148133/?idorvanity=867487150445792&amp;show_text=true"
loading="lazy" allowfullscreen title=
"StoshNews video 3"></iframe></div>
<div class="video-container"><iframe src=
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/947112336947655/&amp;show_text=true"
loading="lazy" allowfullscreen title=
"StoshNews video 4"></iframe></div>
<div class="video-container"><iframe src=
"https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/61562132317250/videos/2286538441690999/&amp;show_text=true"
loading="lazy" allowfullscreen title=
"StoshNews video 5"></iframe></div>
</div>
</main>
<footer>
<p>© 2024 StoshNews</p>
</footer>
<script async defer crossorigin="anonymous" src=
"https://connect.facebook.net/en_US/sdk.js#xfbml=1&amp;version=v19.0">
</script> 
<script>
        document.getElementById('share-btn').addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'StoshNews',
                    text: 'Check out StoshNews!',
                    url: window.location.href
                }).catch(console.error);
            } else {
                alert('Sharing not supported. Use the browser menu to add to Home Screen.');
            }
        });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoshNews</title>
    
    <meta name="theme-color" content="#fc4903">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./assets/icon-192x192.png">
    <link rel="apple-touch-icon" href="./assets/icon-192x192.png">
    <meta name="apple-mobile-web-app-title" content="StoshNews">
    
    <!-- Defer non-critical JS -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX', { 'send_page_view': false });
        
        // Only send pageview after page has loaded
        window.addEventListener('load', () => {
            gtag('event', 'page_view');
        });
    </script>
    
    <style>
        :root {
            --bg: #121212;
            --accent: #fc4903;
            --accent-hover: #ff6b2b;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: #fff;
            margin: 0;
            padding: 0;
            max-width: 100vw;
            text-align: center;
        }
        
        .video-container {
            margin: 20px auto;
            max-width: 560px;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            position: relative;
            overflow: hidden;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        header {
            background: #000;
            padding: 20px;
            text-align: center;
        }
        
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            z-index: 1000;
            display: none;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .install-btn:hover {
            background: var(--accent-hover);
        }
        
        h1 {
            margin: 0;
            font-size: 2rem;
        }
        
        footer {
            margin-top: 30px;
            padding: 20px;
            background: #000;
        }
        
        /* Add loading state for videos */
        .loading {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>StoshNews</h1>
    </header>
    
    <button id="install-btn" class="install-btn">Install App</button>
    
    <div id="video-container"></div>
    
    <footer>
        <p>&copy; 2024 StoshNews</p>
    </footer>

    <script type="module">
        // Load videos dynamically to improve initial page load
        const videoUrls = [
            'https://www.facebook.com/plugins/video.php?height=476&href=https%3A%2F%2Fwww.facebook.com%2F61562132317250%2Fvideos%2F1318313399284753%2F&show_text=false&width=267&t=0',
            'https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2F61562132317250%2Fvideos%2F1574627393251489%2F&show_text=false&width=560&t=0',
            'https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2F61562132317250%2Fvideos%2F486103221194799%2F&show_text=false&width=560&t=0'
        ];
        
        // Use Intersection Observer to lazy load videos
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('video-container');
            
            videoUrls.forEach((url, index) => {
                const videoDiv = document.createElement('div');
                videoDiv.className = 'video-container';
                videoDiv.id = `video-${index}`;
                videoDiv.dataset.src = url;
                container.appendChild(videoDiv);
            });
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const videoDiv = entry.target;
                        const iframe = document.createElement('iframe');
                        iframe.src = videoDiv.dataset.src;
                        iframe.setAttribute('allowfullscreen', '');
                        iframe.setAttribute('scrolling', 'no');
                        iframe.setAttribute('frameborder', '0');
                        iframe.style.border = 'none';
                        iframe.style.overflow = 'hidden';
                        iframe.setAttribute('loading', 'lazy');
                        iframe.allow = 'autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share';
                        videoDiv.appendChild(iframe);
                        observer.unobserve(videoDiv);
                    }
                });
            }, {
                rootMargin: '100px 0px'
            });
            
            document.querySelectorAll('.video-container').forEach(video => {
                observer.observe(video);
            });
        });
        
        // Import analytics helper using dynamic import for better performance
        let Analytics;
        import('./src/analytics.js').then(module => {
            Analytics = module.default;
            // Track page view
            Analytics.pageView('/stosh');
        });
        
        // PWA installation logic
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });
        
        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installBtn.style.display = 'none';
                // Track successful installation
                if (Analytics) Analytics.event('app_installed');
            }
            deferredPrompt = null;
        });
        
        // Register service worker with error handling
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js', { scope: './' })
                    .then((reg) => {
                        console.log('Service Worker registered with scope:', reg.scope);
                        if (Analytics) Analytics.event('sw_registered');
                    })
                    .catch((err) => {
                        console.error('SW registration failed:', err);
                        // Send error to analytics
                        if (Analytics) Analytics.event('sw_error', { error: err.message });
                    });
            });
        }
        
        // Sync offline analytics data when back online
        window.addEventListener('online', function() {
            if (window.localStorage.getItem('offlineAnalytics')) {
                try {
                    const events = JSON.parse(window.localStorage.getItem('offlineAnalytics'));
                    events.forEach(event => gtag('event', event.name, event.params));
                    window.localStorage.removeItem('offlineAnalytics');
                } catch (e) {
                    console.error('Failed to process offline analytics:', e);
                    window.localStorage.removeItem('offlineAnalytics');
                }
            }
        });
    </script>
</body>
</html>

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-XXXXXXXXXX');
        
        // Offline tracking for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('online', function() {
                // Send any stored analytics data when back online
                if (window.localStorage.getItem('offlineAnalytics')) {
                    const events = JSON.parse(window.localStorage.getItem('offlineAnalytics'));
                    events.forEach(event => gtag('event', event.name, event.params));
                    window.localStorage.removeItem('offlineAnalytics');
                }
            });
        }
    </script>

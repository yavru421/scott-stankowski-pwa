    <script>
      // PWA Installation
      let deferredPrompt;
      const installButton = document.getElementById("install-button");

      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installButton.style.display = "block";
      });

      installButton.addEventListener("click", async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === "accepted") {
          installButton.style.display = "none";
        }
        deferredPrompt = null;
      });

      // Service Worker
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("../service-worker.js")
          .catch((error) => console.error("SW registration failed:", error));
      }
      
      // Offline analytics tracking
      window.addEventListener('online', function() {
        // Send any stored analytics data when back online
        if (window.localStorage.getItem('offlineAnalytics')) {
          const events = JSON.parse(window.localStorage.getItem('offlineAnalytics'));
          events.forEach(event => gtag('event', event.name, event.params));
          window.localStorage.removeItem('offlineAnalytics');
        }
      });
    </script>

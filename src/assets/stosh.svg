<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stosh HQ</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1e1e1e;
            padding: 20px;
        }
        .video-container {
            margin: 20px auto;
            max-width: 560px;
        }
        svg {
            width: 100px;
            height: 100px;
            fill: #f5f5f5;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Stosh HQ</h1>
        <p>The official place to experience Stosh content</p>
    </header>
    
    <main>
        <section id="videos">
            <h2>Stosh Videos</h2>
            <p>Check out the latest Stosh content.</p>
            
            <!-- Embed YouTube Video -->
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/YOUR_VIDEO_ID" frameborder="0" allowfullscreen></iframe>
            </div>
            
            <!-- Embed Facebook Video -->
            <div class="video-container">
                <iframe src="https://www.facebook.com/plugins/video.php?href=YOUR_FACEBOOK_VIDEO_URL" width="560" height="315" frameborder="0" allowfullscreen></iframe>
            </div>
        </section>
        
        <section id="stosh-branding">
            <h2>Stosh Aesthetic</h2>
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" stroke="#f5f5f5" stroke-width="5" fill="none" />
            </svg>
            <svg viewBox="0 0 100 100">
                <rect x="20" y="20" width="60" height="60" stroke="#f5f5f5" stroke-width="5" fill="none" />
            </svg>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Stosh HQ. All rights preserved in the legend of Stosh.</p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
